name: Profile artwork

on:
  push:
    paths:
      - "README.md"
      - "assets/promo/**"
      - "assets/fonts/**"
      - "assets/badges/**"
      - "requirements.txt"
      - ".github/workflows/promo-check.yml"
  pull_request:
    paths:
      - "README.md"
      - "assets/promo/**"
      - "assets/fonts/**"
      - "assets/badges/**"
      - "requirements.txt"
      - ".github/workflows/promo-check.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python assets/promo/build.py
      - run: python -m unittest discover -s assets/promo -p "test_*.py"
      - name: Fail if committed artwork is stale
        run: git diff --exit-code -- README.md assets/promo assets/badges
